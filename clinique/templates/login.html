{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Nevroglie — Connexion</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Poppins',system-ui,sans-serif;color:#102a43;background:#1666b3;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1rem;overflow-x:hidden;-webkit-font-smoothing:antialiased}

    /* ── Fond : portraits reliés au formulaire comme des neurones ──
       Les tailles sont pensées pour un écran de 1600 × 900 (--t, en px) et suivent
       ensuite la taille réelle de l'écran : rien ne se chevauche sur un portable. */
    .fond{position:fixed;inset:0;overflow:hidden;background:radial-gradient(800px 560px at 50% 50%,rgba(255,255,255,.2),transparent 70%),linear-gradient(135deg,#0d4a86 0%,#1666b3 48%,#22b8e0 100%)}
    .liens{position:absolute;inset:0;width:100%;height:100%}
    .liens line{stroke:rgba(255,255,255,.42);stroke-width:1.4;stroke-dasharray:5 7;animation:influx 3s linear infinite}
    @keyframes influx{to{stroke-dashoffset:-24}}
    .portrait,.puce{position:absolute;left:var(--x);top:var(--y);width:min(calc(var(--t) / 900 * 100vh),calc(var(--t) / 1600 * 100vw));aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;animation:flotte 7s ease-in-out infinite;animation-delay:var(--d)}
    @keyframes flotte{0%,100%{translate:0 -7px}50%{translate:0 7px}}
    .portrait{padding:6px;background:rgba(255,255,255,.95);box-shadow:0 0 0 8px rgba(255,255,255,.14),0 24px 44px -20px rgba(4,24,50,.85)}
    .visage{width:100%;height:100%;border-radius:50%;background-repeat:no-repeat;background-size:auto 210%}
    .puce{display:flex;align-items:center;justify-content:center;background:#fff;box-shadow:0 12px 26px -10px rgba(4,24,50,.75)}
    .puce svg{width:58%;height:58%;fill:none;stroke:#1666b3;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}

    /* Chaque portrait : la photo, et le cadrage sur le visage. */
    .v1{background-image:url('{% static "consultation/img/pat.jpg" %}');background-position:0% 17.2%}
    .v2{background-image:url('{% static "consultation/img/MED2.jpg" %}');background-position:82.2% 19.1%}
    .v3{background-image:url('{% static "consultation/img/rendezvous.jpg" %}');background-position:63.3% 76.4%}
    .v4{background-image:url('{% static "consultation/img/PA1.jpg" %}');background-position:23.6% 30.5%}
    .v5{background-image:url('{% static "consultation/img/ANA3.jpg" %}');background-position:60.3% 0%}
    .v6{background-image:url('{% static "consultation/img/PA1.jpg" %}');background-position:51.5% 0%}
    .v7{background-image:url('{% static "consultation/img/MED2.jpg" %}');background-position:51.5% 0%}
    .v8{background-image:url('{% static "consultation/img/rendezvous.jpg" %}');background-position:29.4% 0%}
    .v9{background-image:url('{% static "consultation/img/MED2.jpg" %}');background-position:100% 30.5%}
    .v10{background-image:url('{% static "consultation/img/pat.jpg" %}');background-position:76.4% 34.4%}

    /* Sur téléphone et tablette, une rangée de portraits au-dessus du formulaire. */
    .rangee{display:none;position:relative;justify-content:center;margin-bottom:1.1rem}
    .rangee .visage{width:4.4rem;height:4.4rem;border:3px solid #fff;margin-left:-.7rem;box-shadow:0 12px 22px -12px rgba(4,24,50,.8)}
    .rangee .visage:first-child{margin-left:0}

    /* ── Carte de connexion, au milieu de la page ── */
    .colonne{position:relative;z-index:5;width:458px;max-width:100%}
    .carte{background:#fff;border-radius:2.1rem;padding:1.75rem 2.3rem 1.45rem;box-shadow:0 40px 90px -35px rgba(6,30,60,.6),0 0 0 1px rgba(16,42,67,.04)}
    .entete{display:flex;flex-direction:column;align-items:center;text-align:center;margin-bottom:1.15rem}
    .entete img{width:76px;height:76px;object-fit:contain;border-radius:50%;background:#fff;box-shadow:0 0 0 6px rgba(34,184,224,.13),0 12px 26px -10px rgba(13,74,134,.55)}
    .entete h1{font-size:1.45rem;font-weight:700;letter-spacing:-.01em;margin-top:.8rem;line-height:1.2}
    .entete p{font-size:.82rem;color:#5b6f85;margin-top:.15rem}
    .entete p b{color:#1666b3;font-weight:600}

    .erreur{display:flex;align-items:flex-start;gap:.55rem;background:#fdecec;color:#b42318;border-radius:1rem;padding:.65rem .9rem;margin-bottom:.9rem;font-size:.84rem;font-weight:500}

    .champ{display:flex;align-items:center;gap:.7rem;height:3.1rem;padding:0 .35rem 0 1.15rem;border-radius:999px;background:#f3f7fc;border:1.5px solid transparent;margin-bottom:.75rem;color:#5b6f85;transition:border-color .2s,background .2s,box-shadow .2s}
    .champ:focus-within{background:#fff;border-color:#22b8e0;box-shadow:0 0 0 4px rgba(34,184,224,.15)}
    .champ input{flex:1;min-width:0;height:100%;border:0;outline:0;background:transparent;font:inherit;font-size:.9rem;color:#102a43}
    .champ input::placeholder{color:#64788d}
    .champ input:-webkit-autofill{-webkit-box-shadow:0 0 0 40px #f3f7fc inset;-webkit-text-fill-color:#102a43}
    .oeil{width:2.4rem;height:2.4rem;flex-shrink:0;border:0;border-radius:50%;background:none;color:#5b6f85;font-size:1rem;cursor:pointer}
    .oeil:hover{background:rgba(22,102,179,.08);color:#1666b3}

    .options{display:flex;align-items:center;justify-content:space-between;gap:.75rem;font-size:.79rem;margin:.2rem .3rem 1.05rem;color:#486581}
    .options label{display:flex;align-items:center;gap:.45rem;cursor:pointer}
    .options input{width:.95rem;height:.95rem;accent-color:#1666b3}
    .options a{color:#1666b3;font-weight:600;text-decoration:none;white-space:nowrap}
    .options a:hover{text-decoration:underline}

    .btn{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;gap:.6rem;width:100%;height:3.2rem;border:0;border-radius:999px;background:linear-gradient(120deg,#1666b3,#22b8e0);color:#fff;font:inherit;font-weight:600;font-size:.98rem;cursor:pointer;box-shadow:0 16px 30px -14px rgba(22,102,179,.8);transition:transform .2s}
    .btn:hover{transform:translateY(-2px)}
    .btn::after{content:'';position:absolute;top:0;bottom:0;width:40%;left:-60%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.4),transparent);animation:reflet 5s ease-in-out infinite}
    @keyframes reflet{0%,70%{left:-60%}100%{left:130%}}
    .annuler{display:block;text-align:center;margin-top:.7rem;font-size:.8rem;font-weight:500;color:#5b6f85;text-decoration:none}
    .annuler:hover{color:#1666b3}

    @media (max-width:1099.98px){
      .portrait,.puce,.liens{display:none}
      .rangee{display:flex}
    }
    @media (max-width:479.98px){
      body{padding:1.1rem .85rem}
      .carte{padding:1.5rem 1.35rem 1.25rem;border-radius:1.7rem}
      .entete img{width:66px;height:66px}
      .entete h1{font-size:1.3rem}
      .rangee .visage{width:3.8rem;height:3.8rem}
    }
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
</head>
<body>

<div class="fond" aria-hidden="true">
  <svg class="liens" viewBox="0 0 100 100" preserveAspectRatio="none">
    <g vector-effect="non-scaling-stroke">
      <line x1="10" y1="21" x2="26.5" y2="13" vector-effect="non-scaling-stroke"/>
      <line x1="10" y1="21" x2="24.5" y2="47" vector-effect="non-scaling-stroke"/>
      <line x1="26.5" y1="13" x2="45" y2="35" vector-effect="non-scaling-stroke"/>
      <line x1="24.5" y1="47" x2="40" y2="42" vector-effect="non-scaling-stroke"/>
      <line x1="10" y1="21" x2="16.5" y2="42" vector-effect="non-scaling-stroke"/>
      <line x1="16.5" y1="42" x2="8" y2="62" vector-effect="non-scaling-stroke"/>
      <line x1="8" y1="62" x2="24.5" y2="47" vector-effect="non-scaling-stroke"/>
      <line x1="8" y1="62" x2="23" y2="81" vector-effect="non-scaling-stroke"/>
      <line x1="23" y1="81" x2="24.5" y2="47" vector-effect="non-scaling-stroke"/>
      <line x1="23" y1="81" x2="45" y2="65" vector-effect="non-scaling-stroke"/>
      <line x1="14" y1="86" x2="23" y2="81" vector-effect="non-scaling-stroke"/>
      <line x1="14" y1="86" x2="8" y2="62" vector-effect="non-scaling-stroke"/>
      <line x1="26.5" y1="13" x2="30" y2="30" vector-effect="non-scaling-stroke"/>
      <line x1="30" y1="30" x2="24.5" y2="47" vector-effect="non-scaling-stroke"/>
      <line x1="30" y1="30" x2="45" y2="40" vector-effect="non-scaling-stroke"/>
      <line x1="75" y1="17" x2="91" y2="26" vector-effect="non-scaling-stroke"/>
      <line x1="75" y1="17" x2="55" y2="35" vector-effect="non-scaling-stroke"/>
      <line x1="91" y1="26" x2="83.5" y2="37" vector-effect="non-scaling-stroke"/>
      <line x1="83.5" y1="37" x2="76.5" y2="50" vector-effect="non-scaling-stroke"/>
      <line x1="76.5" y1="50" x2="91.5" y2="62" vector-effect="non-scaling-stroke"/>
      <line x1="91.5" y1="62" x2="91" y2="26" vector-effect="non-scaling-stroke"/>
      <line x1="76.5" y1="50" x2="60" y2="44" vector-effect="non-scaling-stroke"/>
      <line x1="91.5" y1="62" x2="87" y2="85" vector-effect="non-scaling-stroke"/>
      <line x1="87" y1="85" x2="75" y2="84" vector-effect="non-scaling-stroke"/>
      <line x1="75" y1="84" x2="76.5" y2="50" vector-effect="non-scaling-stroke"/>
      <line x1="75" y1="84" x2="55" y2="65" vector-effect="non-scaling-stroke"/>
      <line x1="69.5" y1="69" x2="76.5" y2="50" vector-effect="non-scaling-stroke"/>
      <line x1="69.5" y1="69" x2="75" y2="84" vector-effect="non-scaling-stroke"/>
      <line x1="75" y1="17" x2="76.5" y2="50" vector-effect="non-scaling-stroke"/>
    </g>
  </svg>

  <div class="portrait" style="--x:10%;--y:21%;--t:196;--d:0s"><div class="visage v1"></div></div>
  <div class="portrait" style="--x:26.5%;--y:13%;--t:122;--d:-.9s"><div class="visage v2"></div></div>
  <div class="portrait" style="--x:24.5%;--y:47%;--t:150;--d:-1.8s"><div class="visage v3"></div></div>
  <div class="portrait" style="--x:8%;--y:62%;--t:138;--d:-2.7s"><div class="visage v4"></div></div>
  <div class="portrait" style="--x:23%;--y:81%;--t:172;--d:-3.6s"><div class="visage v5"></div></div>
  <div class="portrait" style="--x:75%;--y:17%;--t:168;--d:-4.5s"><div class="visage v6"></div></div>
  <div class="portrait" style="--x:91%;--y:26%;--t:132;--d:-5.4s"><div class="visage v7"></div></div>
  <div class="portrait" style="--x:76.5%;--y:50%;--t:136;--d:-6.3s"><div class="visage v8"></div></div>
  <div class="portrait" style="--x:91.5%;--y:62%;--t:170;--d:-7.2s"><div class="visage v9"></div></div>
  <div class="portrait" style="--x:75%;--y:84%;--t:142;--d:-8.1s"><div class="visage v10"></div></div>

  <div class="puce" style="--x:16.5%;--y:42%;--t:58;--d:0s"><svg viewBox="0 0 64 64"><path d="M16 6h-3v14a13 13 0 0 0 26 0V6h-3"/><path d="M26 33v9a11 11 0 0 0 22 0v-7"/><circle cx="48" cy="29" r="6"/></svg></div>
  <div class="puce" style="--x:83.5%;--y:37%;--t:58;--d:-1.3s"><svg viewBox="0 0 64 64"><path d="M30 9a9 9 0 0 0-9 7 9 9 0 0 0-7 14 9 9 0 0 0 4 14 9 9 0 0 0 12 8z"/><path d="M34 9a9 9 0 0 1 9 7 9 9 0 0 1 7 14 9 9 0 0 1-4 14 9 9 0 0 1-12 8z"/><path d="M22 24c3 0 5 2 5 5M42 24c-3 0-5 2-5 5M20 38c3-2 6-1 7 2M44 38c-3-2-6-1-7 2"/></svg></div>
  <div class="puce" style="--x:14%;--y:86%;--t:54;--d:-2.6s"><svg viewBox="0 0 64 64"><path d="M32 56S7 41 7 23a13 13 0 0 1 25-5 13 13 0 0 1 25 5c0 18-25 33-25 33z"/><path d="M14 31h10l4-8 6 15 4-7h12"/></svg></div>
  <div class="puce" style="--x:87%;--y:85%;--t:54;--d:-3.9s"><svg viewBox="0 0 64 64"><g transform="rotate(-40 32 32)"><rect x="6" y="20" width="52" height="24" rx="12"/><path d="M32 20v24"/><path d="M14 27c2-2 4-2.5 8-2.5"/></g></svg></div>
  <div class="puce" style="--x:30%;--y:30%;--t:46;--d:-5.2s"><svg viewBox="0 0 64 64"><g transform="rotate(-45 32 32)"><path d="M2 32h10"/><rect x="12" y="25" width="30" height="14" rx="2"/><path d="M42 21v22M42 32h12M54 24v16"/><path d="M19 25v6M26 25v6M33 25v6"/></g></svg></div>
  <div class="puce" style="--x:69.5%;--y:69%;--t:46;--d:-6.5s"><svg viewBox="0 0 64 64"><path d="M3 34h13l5-16 9 30 7-22 4 8h20"/></svg></div>
</div>

<div class="colonne">
  <div class="rangee" aria-hidden="true">
    <div class="visage v6"></div>
    <div class="visage v1"></div>
    <div class="visage v5"></div>
    <div class="visage v7"></div>
    <div class="visage v9"></div>
  </div>

  <main class="carte">
    <div class="entete">
      <img src="{% static 'consultation/img/logo_clinique.jpg' %}" alt="Logo de la Poly Clinique Nevroglie">
      <h1>Heureux de vous revoir</h1>
      <p><b>NEVROGLIE</b> · Poly Clinique — Neurologie</p>
    </div>

    {% if form.errors %}
    <div class="erreur" role="alert">
      <i class="bi bi-exclamation-triangle-fill"></i>
      <span>Nom d'utilisateur ou mot de passe incorrect.</span>
    </div>
    {% endif %}

    <form method="post">
      {% csrf_token %}
      <div class="champ">
        <i class="bi bi-person"></i>
        <input type="text" name="username" placeholder="Nom d'utilisateur" aria-label="Nom d'utilisateur" autocomplete="username"
               required {% if not remembered_username %}autofocus{% endif %}
               value="{{ form.username.value|default:remembered_username|default:'' }}">
      </div>
      <div class="champ">
        <i class="bi bi-lock"></i>
        <input type="password" name="password" id="pw" placeholder="Mot de passe" aria-label="Mot de passe" autocomplete="current-password" required {% if remembered_username %}autofocus{% endif %}>
        <button type="button" class="oeil" onclick="togglePw()" aria-label="Afficher ou masquer le mot de passe">
          <i class="bi bi-eye" id="pw-eye"></i>
        </button>
      </div>
      <div class="options">
        <label>
          <input type="checkbox" name="remember" {% if remembered_username %}checked{% endif %}>
          Se souvenir de moi
        </label>
        <a href="{% url 'password_reset' %}">Mot de passe oublié ?</a>
      </div>
      <button type="submit" class="btn">Se connecter <i class="bi bi-arrow-right"></i></button>
      <a href="/" class="annuler">Annuler</a>
    </form>
  </main>
</div>

<script>
function togglePw(){
  const pw=document.getElementById('pw'),eye=document.getElementById('pw-eye'),show=pw.type==='password';
  pw.type=show?'text':'password';eye.className=show?'bi bi-eye-slash':'bi bi-eye';
}
</script>
</body>
</html>
