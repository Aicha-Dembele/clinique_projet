{% comment %}
  Les styles du tableau de planning. Dans un gabarit a part parce que
  DEUX pages l affichent : « Planning du jour » et le formulaire de
  rendez-vous. A inclure dans leur bloc extra_css.
{% endcomment %}
<style>
.pl-wrap { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 1rem; overflow: hidden; box-shadow: var(--shadow-sm); }

.pl-nav { display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap; padding: .9rem 1.3rem; border-bottom: 1px solid var(--card-border); }
.pl-nav-title { font-size: 1.05rem; font-weight: 800; color: var(--text-primary); text-transform: capitalize; }
.pl-nav-btn { width: 32px; height: 32px; border-radius: .5rem; display: inline-flex; align-items: center; justify-content: center; border: 1px solid var(--card-border); background: var(--card-bg); color: var(--text-muted); text-decoration: none; font-size: .9rem; transition: all .15s; }
.pl-nav-btn:hover { background: var(--primary); color: #fff; border-color: var(--primary); }
.pl-today-btn { padding: .32rem .85rem; font-size: .78rem; font-weight: 700; border: 1px solid var(--card-border); border-radius: .5rem; background: var(--card-bg); color: var(--text-secondary); text-decoration: none; transition: all .15s; }
.pl-today-btn:hover { border-color: var(--primary); color: var(--primary); }
.pl-date-input { padding: .3rem .6rem; font-size: .82rem; border: 1px solid var(--card-border); border-radius: .5rem; background: var(--card-bg); color: var(--text-primary); }

/* ══ LE TABLEAU ══ */
.pl-scroll { overflow-x: auto; }
.pl-grid { width: 100%; border-collapse: collapse; min-width: 520px; }

.pl-grid thead th { padding: .7rem .8rem; border-bottom: 1px solid var(--card-border); vertical-align: bottom; text-align: left; }
.pl-grid thead th.pl-h-col { width: 74px; min-width: 74px; text-align: center; }

.pl-medecin-nom { font-size: .88rem; font-weight: 800; color: var(--text-primary); line-height: 1.25; }
.pl-medecin-spe { font-size: .7rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: .05em; }
.pl-charge { display: inline-block; margin-top: .3rem; padding: .12rem .5rem; font-size: .68rem; font-weight: 800; border-radius: 999px; }
.pl-charge-0 { background: rgba(16,185,129,.14); color: #059669; }
.pl-charge-n { background: rgba(59,130,246,.14); color: #2563eb; }

.pl-grid tbody td { padding: 0; border-bottom: 1px solid var(--card-border); border-left: 1px solid var(--card-border); vertical-align: top; height: 52px; }
.pl-grid tbody td:first-child { border-left: none; }
.pl-grid tbody tr:last-child td { border-bottom: none; }

.pl-heure { width: 74px; min-width: 74px; text-align: center; font-size: .74rem; font-weight: 700; color: var(--text-muted); font-variant-numeric: tabular-nums; padding-top: .5rem !important; background: rgba(148,163,184,.05); }

.pl-cell { padding: .3rem !important; }
.pl-libre { display: block; padding: .5rem .3rem; text-align: center; font-size: .72rem; color: var(--text-muted); opacity: .45; }

/* ══ UNE CASE OCCUPÉE ══ */
.pl-rdv { display: block; padding: .4rem .55rem; margin-bottom: .3rem; border-radius: .5rem; border-left: 3px solid var(--primary); background: rgba(59,130,246,.09); text-decoration: none; }
.pl-rdv:last-child { margin-bottom: 0; }
.pl-rdv:hover { background: rgba(59,130,246,.16); }
.pl-rdv-heure { font-size: .68rem; font-weight: 800; color: var(--primary); font-variant-numeric: tabular-nums; }
.pl-rdv-patient { font-size: .8rem; font-weight: 700; color: var(--text-primary); line-height: 1.3; }

.pl-rdv-termine { border-left-color: #10b981; background: rgba(16,185,129,.09); }
.pl-rdv-termine .pl-rdv-heure { color: #059669; }
.pl-rdv-annule { border-left-color: #94a3b8; background: rgba(148,163,184,.1); }
.pl-rdv-annule .pl-rdv-heure { color: var(--text-muted); }
.pl-rdv-annule .pl-rdv-patient { text-decoration: line-through; color: var(--text-muted); }

/* La coupure quand des heures creuses ont été sautées. */
.pl-saut td { padding: .25rem .8rem !important; height: auto !important; text-align: center; font-size: .68rem; text-transform: uppercase; letter-spacing: .08em; color: var(--text-muted); background: rgba(148,163,184,.07); opacity: .7; }

.pl-vide { padding: 3rem 1.5rem; text-align: center; color: var(--text-muted); }
.pl-vide i { font-size: 2.2rem; opacity: .35; display: block; margin-bottom: .7rem; }

.pl-note { margin-top: .9rem; font-size: .76rem; color: var(--text-muted); display: flex; align-items: flex-start; gap: .45rem; }
.pl-note i { margin-top: .1rem; }
</style>
